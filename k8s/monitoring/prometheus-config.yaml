apiVersion: v1
kind: ConfigMap

metadata:
  name: prometheus-config
  namespace: monitoring

data:
  prometheus.yml: |
    global:
      scrape_interval: 5s

    scrape_configs:

      - job_name: 'worldops-backend'

        metrics_path: /metrics

        static_configs:
          - targets:
              - backend.worldops.svc.cluster.local:8000
