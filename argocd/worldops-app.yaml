apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: worldops
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/GonzalezJulio/worldops-2026
    targetRevision: main
    path: k8s

    directory:
      recurse: true

  destination:
    server: https://kubernetes.default.svc
    namespace: worldops

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true